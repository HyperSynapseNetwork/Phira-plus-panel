name: Panel Build

# Panel CI (design §26.4): reproducible install → lint → contract-consistency →
# vue-tsc → tests → Nuxt SPA build → noindex regression check.
# No sitemap is ever generated.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Official CI chooses its endpoint explicitly. Self-host builds must inject the
# deployment's PPB URL and fail fast if it is omitted.
env:
  NUXT_PUBLIC_API_BASE: https://api-phira.htadiy.com

jobs:
  build:
    name: Lint · contract · typecheck · test · build · noindex
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager" (pnpm@11.8.0)

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Contract consistency (DESIGN/CONTRACT_CONSISTENCY_TEST.md): every
      # /api/v1… and /ws/v1… call in panel source must resolve in the PPB
      # OpenAPI (method + path, {param} wildcard). Fails on any unregistered
      # call so contract drift is caught at CI time.
      - name: Contract consistency
        run: node scripts/check-contract-consistency.mjs
      - name: Current documentation truthfulness
        run: python3 scripts/check-current-docs.py

      - name: Frontend Design Contract gate
        run: pnpm test:design-contract

      - name: Error locale completeness gate
        run: pnpm test:error-i18n
      - name: Product copy / accessibility i18n gate
        run: pnpm test:product-copy
      - name: Runtime template semantics gate
        run: pnpm test:runtime-semantics

      - name: Typecheck (vue-tsc)
        run: pnpm vue-tsc

      - name: Unit / component tests
        run: pnpm test

      - name: Nuxt SPA build
        run: pnpm build

      - name: Noindex regression check
        run: pnpm test:noindex
